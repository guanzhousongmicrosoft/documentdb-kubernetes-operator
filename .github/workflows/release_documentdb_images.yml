name: RELEASE - Promote DocumentDB Images

# Promotes documentdb extension and gateway candidate images to release tags,
# then creates a PR to update default versions across the codebase.
# This workflow handles only the DATABASE version track (documentDbVersion).
# For operator/sidecar releases, see release_operator.yml.

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Database candidate tag to promote (e.g., 0.111.0-build-123456789-1-deadbee)'
        required: true
      version:
        description: 'Database image release version (e.g., 0.111.0)'
        required: true
        default: '0.113.0'
      update_defaults:
        description: 'Create PR to update default image versions in code'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

env:
  DOCUMENTDB_DEB_REPOSITORY: ghcr.io/${{ github.repository }}/documentdb-deb13

jobs:
  # ---------------------------------------------------------------------------
  # Promote documentdb and gateway images (retag candidate → release)
  # ---------------------------------------------------------------------------
  promote-database-images:
    name: Promote ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [documentdb, gateway]
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Verify candidate exists
        run: |
          echo "Verifying ${{ matrix.image }}:${{ inputs.candidate_version }} exists..."
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ inputs.candidate_version }}

      - name: Retag existing manifest
        env:
          SOURCE_TAG: ${{ inputs.candidate_version }}
          TARGET_TAG: ${{ inputs.version }}
        run: |
          echo "Promoting ${{ matrix.image }} from $SOURCE_TAG to $TARGET_TAG"
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ env.TARGET_TAG }} \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ env.SOURCE_TAG }}

  # ---------------------------------------------------------------------------
  # Promote signed Debian package artifacts (retag candidate -> release)
  # ---------------------------------------------------------------------------
  promote-extension-packages:
    name: Promote DocumentDB Debian Package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      SOURCE_TAG: ${{ inputs.candidate_version }}-pg18-${{ matrix.arch }}
      TARGET_TAG: ${{ inputs.version }}-pg18-${{ matrix.arch }}
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify and retag package artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="${{ env.DOCUMENTDB_DEB_REPOSITORY }}:${SOURCE_TAG}"
          SOURCE_DIGEST=$(oras resolve "$SOURCE_REF")

          cosign verify \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/\\.github/workflows/build_documentdb_images\\.yml@refs/(heads|tags)/[-A-Za-z0-9_./]+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.DOCUMENTDB_DEB_REPOSITORY }}@${SOURCE_DIGEST}"

          oras tag "${{ env.DOCUMENTDB_DEB_REPOSITORY }}@${SOURCE_DIGEST}" "$TARGET_TAG"
          TARGET_DIGEST=$(oras resolve "${{ env.DOCUMENTDB_DEB_REPOSITORY }}:${TARGET_TAG}")
          if [[ "$TARGET_DIGEST" != "$SOURCE_DIGEST" ]]; then
            echo "Promoted package digest mismatch: source=$SOURCE_DIGEST target=$TARGET_DIGEST" >&2
            exit 1
          fi
          echo "Promoted $SOURCE_REF to ${{ env.DOCUMENTDB_DEB_REPOSITORY }}:${TARGET_TAG} at $TARGET_DIGEST"

  # ---------------------------------------------------------------------------
  # Update default versions in code and create PR
  # ---------------------------------------------------------------------------
  update-defaults:
    name: Update Default Versions
    runs-on: ubuntu-latest
    needs: [promote-database-images, promote-extension-packages]
    if: ${{ inputs.update_defaults == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect current default version
        id: current
        run: |
          # Extract the assigned DEFAULT_DOCUMENTDB_IMAGE value from constants.go.
          CURRENT=$(sed -nE 's|^[[:space:]]*DEFAULT_DOCUMENTDB_IMAGE[[:space:]]*=.*:([0-9]+\.[0-9]+\.[0-9]+)".*|\1|p' \
            operator/src/internal/utils/constants.go | head -1)
          if [[ -z "$CURRENT" ]]; then
            echo "Failed to extract current default version from operator/src/internal/utils/constants.go" >&2
            exit 1
          fi
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current default version: $CURRENT"

      - name: Update version references
        env:
          OLD_VERSION: ${{ steps.current.outputs.current_version }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
            echo "Version $NEW_VERSION is already the default. No changes needed."
            exit 0
          fi

          echo "Updating default versions: $OLD_VERSION → $NEW_VERSION"

          # 1. Update operator constants.go
          sed -i "s|:${OLD_VERSION}\"|:${NEW_VERSION}\"|g" \
            operator/src/internal/utils/constants.go

          # 2. Update sidecar plugin config.go
          sed -i "s|:${OLD_VERSION}\"|:${NEW_VERSION}\"|g" \
            operator/cnpg-plugins/sidecar-injector/internal/config/config.go

          # 3. Update Helm chart values.yaml
          sed -i "s|documentDbVersion: \"${OLD_VERSION}\"|documentDbVersion: \"${NEW_VERSION}\"|" \
            operator/documentdb-helm-chart/values.yaml

          # 4. (Removed) Test workflow fallback images — the legacy
          # test-backup-and-restore.yml and test-upgrade-and-rollback.yml
          # workflows have been consolidated into test-e2e.yml. Database
          # image versions for e2e are resolved from the operator's
          # built-in defaults (constants.go) rather than per-workflow
          # fallback tags, so no sed is required here.

          # 5. Update sidecar plugin config test (hardcoded expected gateway image)
          sed -i "s|:${OLD_VERSION}\"|:${NEW_VERSION}\"|g" \
            operator/cnpg-plugins/sidecar-injector/internal/config/config_test.go

          # 6. Update build workflow defaults
          sed -i "s|DEFAULT_DOCUMENTDB_VERSION: '${OLD_VERSION}'|DEFAULT_DOCUMENTDB_VERSION: '${NEW_VERSION}'|" \
            .github/workflows/build_documentdb_images.yml
          sed -i "s|default: '${OLD_VERSION}'|default: '${NEW_VERSION}'|g" \
            .github/workflows/build_documentdb_images.yml

          # 7. Update release workflow default version
          sed -i "s|default: '${OLD_VERSION}'|default: '${NEW_VERSION}'|g" \
            .github/workflows/release_documentdb_images.yml

          # 8. Update gateway Dockerfile default source image ARG
          sed -i "s|pg17-${OLD_VERSION}|pg17-${NEW_VERSION}|" \
            .github/dockerfiles/Dockerfile_gateway_public_image

          # 9. Update e2e schema-upgrade default version pair. This is the
          # single source of truth for the two-phase migration spec's CI
          # default (test-e2e.yml passes only an optional override), so the
          # released pair advances with each DB release: old <- previous
          # default (OLD_VERSION), new <- released version (NEW_VERSION).
          sed -i -E "s|(defaultOldDocumentDBVersion = )\"[0-9]+\.[0-9]+\.[0-9]+\"|\1\"${OLD_VERSION}\"|" \
            test/e2e/tests/upgrade/helpers_test.go
          sed -i -E "s|(defaultNewDocumentDBVersion = )\"[0-9]+\.[0-9]+\.[0-9]+\"|\1\"${NEW_VERSION}\"|" \
            test/e2e/tests/upgrade/helpers_test.go

          echo "=== Files modified ==="
          git diff --name-only
          echo ""
          echo "=== Diff ==="
          git diff

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump DocumentDB default images to ${{ inputs.version }}"
          title: "chore: bump DocumentDB default images to ${{ inputs.version }}"
          body: |
            ## Automated DocumentDB Version Bump

            Promoted images `documentdb` and `gateway` from candidate `${{ inputs.candidate_version }}` to release `${{ inputs.version }}`.

            ### Changes
            - Updated `DEFAULT_DOCUMENTDB_IMAGE` and `DEFAULT_GATEWAY_IMAGE` in `constants.go`
            - Updated sidecar plugin default gateway image in `config.go` and `config_test.go`
            - Updated `documentDbVersion` in Helm chart `values.yaml`
            - Updated build/release workflow defaults in `build_documentdb_images.yml` and `release_documentdb_images.yml`
            - Updated gateway Dockerfile default source image in `Dockerfile_gateway_public_image`
            - Updated e2e schema-upgrade default version pair in `test/e2e/tests/upgrade/helpers_test.go` (old `${{ steps.current.outputs.current_version }}` → new `${{ inputs.version }}`)

            ### Image References
            - `ghcr.io/${{ github.repository }}/documentdb:${{ inputs.version }}`
            - `ghcr.io/${{ github.repository }}/gateway:${{ inputs.version }}`

            ### Debian Package Artifacts
            - `ghcr.io/${{ github.repository }}/documentdb-deb13:${{ inputs.version }}-pg18-amd64`
            - `ghcr.io/${{ github.repository }}/documentdb-deb13:${{ inputs.version }}-pg18-arm64`

            ---
            *Auto-generated by `release_documentdb_images.yml`*
          branch: auto/documentdb-${{ inputs.version }}
          delete-branch: true
          labels: |
            automated
            version-bump

      - name: Release summary
        run: |
          {
            echo "## DocumentDB Image Release Summary"
            echo ""
            echo "- **Database Version**: \`${{ inputs.version }}\`"
            echo "- **Images Promoted**: documentdb, gateway"
            echo "- **Debian Packages Promoted**: debian13, PostgreSQL 18, amd64 + arm64"
            echo "- **Source Tag**: \`${{ inputs.candidate_version }}\` → \`${{ inputs.version }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.current.outputs.current_version }}" != "${{ inputs.version }}" ]]; then
            echo "- **PR Created**: Updates default versions from \`${{ steps.current.outputs.current_version }}\` to \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **No PR needed**: Version \`${{ inputs.version }}\` is already the default" >> "$GITHUB_STEP_SUMMARY"
          fi
