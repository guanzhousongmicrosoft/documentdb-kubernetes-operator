name: RELEASE - Promote DocumentDB Images

# Verifies and promotes DocumentDB extension packages and database images.
# Updating the operator's default DocumentDB version is a separate reviewed change.

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Database candidate tag to promote (e.g., 0.116.0-build-123456789-1-deadbee)'
        required: true
      version:
        description: 'Database image release version (e.g., 0.116.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-documentdb-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOCUMENTDB_DEB_REPOSITORY: ghcr.io/${{ github.repository }}/documentdb-deb13
  BUILD_WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build_documentdb_images.yml@${{ github.ref }}

jobs:
  promote:
    name: Verify and Promote Candidate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Validate release inputs
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use dotted semver format, got: $VERSION" >&2
            exit 1
          fi
          if [[ "$CANDIDATE_VERSION" != "${VERSION}-build-"* ||
                ! "$CANDIDATE_VERSION" =~ -build-[0-9]+-[0-9]+-[0-9a-f]{7}$ ]]; then
            echo "Candidate '$CANDIDATE_VERSION' was not built for version '$VERSION'" >&2
            exit 1
          fi

      - name: Verify complete candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_DASH=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+)\.([0-9]+)$/\1-\2/')

          for IMAGE in documentdb gateway; do
            REPOSITORY="ghcr.io/${GITHUB_REPOSITORY}/${IMAGE}"
            SOURCE_REF="${REPOSITORY}:${CANDIDATE_VERSION}"
            SOURCE_DIGEST=$(docker buildx imagetools inspect "$SOURCE_REF" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            PLATFORMS=$(docker buildx imagetools inspect "$SOURCE_REF" --raw |
              jq -r '[.manifests[].platform.architecture] | sort | join(",")')

            if [[ ! "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ||
                  "$PLATFORMS" != "amd64,arm64" ]]; then
              echo "$SOURCE_REF is not a valid amd64/arm64 image candidate" >&2
              exit 1
            fi

            cosign verify \
              --certificate-identity "$BUILD_WORKFLOW_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${REPOSITORY}@${SOURCE_DIGEST}"

            TARGET_REF="${REPOSITORY}:${VERSION}"
            if TARGET_DIGEST=$(docker buildx imagetools inspect "$TARGET_REF" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'); then
              if [[ "$TARGET_DIGEST" != "$SOURCE_DIGEST" ]]; then
                echo "$TARGET_REF already exists at $TARGET_DIGEST, not $SOURCE_DIGEST" >&2
                exit 1
              fi
            fi
          done

          for ARCH in amd64 arm64; do
            SOURCE_REF="${DOCUMENTDB_DEB_REPOSITORY}:${CANDIDATE_VERSION}-pg18-${ARCH}"
            SOURCE_DIGEST=$(oras resolve "$SOURCE_REF")

            cosign verify \
              --certificate-identity "$BUILD_WORKFLOW_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${DOCUMENTDB_DEB_REPOSITORY}@${SOURCE_DIGEST}"

            VERIFY_DIR=$(mktemp -d)
            oras pull "${DOCUMENTDB_DEB_REPOSITORY}@${SOURCE_DIGEST}" --output "$VERIFY_DIR"
            jq -e \
              --arg version "$VERSION" \
              --arg packageVersion "$VERSION_DASH" \
              --arg arch "$ARCH" \
              '.documentdbVersion == $version and
               .package.name == "postgresql-18-documentdb" and
               .package.version == $packageVersion and
               .package.os == "debian13" and
               .package.postgresMajor == "18" and
               .package.architecture == $arch' \
              "$VERIFY_DIR/build-metadata.json" >/dev/null
            rm -rf "$VERIFY_DIR"

            TARGET_REF="${DOCUMENTDB_DEB_REPOSITORY}:${VERSION}-pg18-${ARCH}"
            if TARGET_DIGEST=$(oras resolve "$TARGET_REF" 2>/dev/null); then
              if [[ "$TARGET_DIGEST" != "$SOURCE_DIGEST" ]]; then
                echo "$TARGET_REF already exists at $TARGET_DIGEST, not $SOURCE_DIGEST" >&2
                exit 1
              fi
            fi
          done

      - name: Promote verified candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for IMAGE in documentdb gateway; do
            REPOSITORY="ghcr.io/${GITHUB_REPOSITORY}/${IMAGE}"
            SOURCE_DIGEST=$(docker buildx imagetools inspect "${REPOSITORY}:${CANDIDATE_VERSION}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            TARGET_REF="${REPOSITORY}:${VERSION}"

            if TARGET_DIGEST=$(docker buildx imagetools inspect "$TARGET_REF" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'); then
              echo "$TARGET_REF already points to verified digest $TARGET_DIGEST"
            else
              docker buildx imagetools create -t "$TARGET_REF" "${REPOSITORY}@${SOURCE_DIGEST}"
            fi

            TARGET_DIGEST=$(docker buildx imagetools inspect "$TARGET_REF" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$TARGET_DIGEST" == "$SOURCE_DIGEST" ]]
          done

          for ARCH in amd64 arm64; do
            SOURCE_REF="${DOCUMENTDB_DEB_REPOSITORY}:${CANDIDATE_VERSION}-pg18-${ARCH}"
            SOURCE_DIGEST=$(oras resolve "$SOURCE_REF")
            TARGET_REF="${DOCUMENTDB_DEB_REPOSITORY}:${VERSION}-pg18-${ARCH}"

            if TARGET_DIGEST=$(oras resolve "$TARGET_REF" 2>/dev/null); then
              echo "$TARGET_REF already points to verified digest $TARGET_DIGEST"
            else
              oras tag "${DOCUMENTDB_DEB_REPOSITORY}@${SOURCE_DIGEST}" "${VERSION}-pg18-${ARCH}"
            fi

            TARGET_DIGEST=$(oras resolve "$TARGET_REF")
            [[ "$TARGET_DIGEST" == "$SOURCE_DIGEST" ]]
          done

      - name: Release summary
        run: |
          {
            echo "## DocumentDB Image Release Summary"
            echo ""
            echo "- **Database Version**: \`${{ inputs.version }}\`"
            echo "- **Source Candidate**: \`${{ inputs.candidate_version }}\`"
            echo "- **Images Promoted**: documentdb, gateway"
            echo "- **Packages Promoted**: Debian 13, PostgreSQL 18, amd64 + arm64"
            echo ""
            echo "Default operator image versions are updated separately through a reviewed pull request."
          } >> "$GITHUB_STEP_SUMMARY"
